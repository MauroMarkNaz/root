# STAGED REFERENCE — NOT ACTIVE. Reference for local OpenSSF
# Scorecard runs (the scorecard CLI / docker image runs fine
# locally). Do NOT copy into .github/workflows/ without Mauro's
# explicit, per-item order (ghost-host doctrine — see
# ENABLEMENTS.md). Manual dispatch only, by design.
name: "OpenSSF Scorecard (staged reference)"

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # UNVERIFIED pin — GitHub API rate limit hit 2026-11-08; verify before any activation
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2 # UNVERIFIED pin — verify current major before any activation
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
