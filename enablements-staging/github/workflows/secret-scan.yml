# STAGED REFERENCE — NOT ACTIVE. Reference for local secret scans
# (`trufflehog` / `gitleaks detect` with VM-installed tools — see
# VM-TOOLS.md). Do NOT copy into .github/workflows/ without
# Mauro's explicit, per-item order (ghost-host doctrine — see
# ENABLEMENTS.md). Manual dispatch only, by design.
name: "Secret scan — TruffleHog + gitleaks (staged reference)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # UNVERIFIED pin — GitHub API rate limit hit 2026-11-08; verify before any activation
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3 # UNVERIFIED pin — verify current major before any activation
        with:
          path: ./
          extra_args: --only-verified

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # UNVERIFIED pin — see above
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2 # UNVERIFIED pin — verify before any activation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
